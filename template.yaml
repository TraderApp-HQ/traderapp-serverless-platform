AWSTemplateFormatVersion: 2010-09-09
Description: traderapp-serverless-platform
Transform:
  - AWS::Serverless-2016-10-31

Metadata:
  BuildMethod: esbuild
  BuildProperties:
    Minify: true
    Target: es2020
    SourceMap: true
    InlineSourceMap: false
    External:
      - aws-sdk # Example of excluding the AWS SDK
    AbsWorkingDir: . # Root directory for absolute imports

Globals:
  Function:
    LoggingConfig:
      LogFormat: JSON

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name to prefix resources
  
  VpcId:
    Type: String
    Description: VPC ID where Lambda functions will run
    Default: "" # Make it optional for environments that don't need VPC
  
  SubnetIds:
    Type: CommaDelimitedList
    Description: Comma-separated list of subnet IDs (private subnets with NAT Gateway)
    Default: ""
  
  SecurityGroupIds:
    Type: CommaDelimitedList
    Description: Comma-separated list of security group IDs for Lambda functions
    Default: ""

Conditions:
  HasVpcConfig: !Not [!Equals [!Ref VpcId, ""]]

Resources:
# create queues
  emailOtpQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-emailOtpQueue
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt emailOtpDLQ.Arn
        maxReceiveCount: 3
  emailOtpDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-emailOtpDLQ
  
  emailNotificationsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-emailNotificationsQueue
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt emailNotificationsDLQ.Arn
        maxReceiveCount: 3
  emailNotificationsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-emailNotificationsDLQ

  userReferralsTrackingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-userReferralsTrackingQueue
      VisibilityTimeout: 90
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt userReferralsTrackingDLQ.Arn
        maxReceiveCount: 3
  userReferralsTrackingDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-userReferralsTrackingDLQ

  cryptopayChannelsWebhooksQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-cryptopayChannelsWebhooksQueue
      VisibilityTimeout: 90
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt cryptopayChannelsWebhooksDLQ.Arn
        maxReceiveCount: 3
  cryptopayChannelsWebhooksDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-cryptopayChannelsWebhooksDLQ

  cryptopayInvoiceWebhooksQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-cryptopayInvoiceWebhooksQueue
      VisibilityTimeout: 90
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt cryptopayInvoiceWebhooksDLQ.Arn
        maxReceiveCount: 3
  cryptopayInvoiceWebhooksDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-cryptopayInvoiceWebhooksDLQ

  cryptopayWithdrawalWebhooksQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-cryptopayWithdrawalWebhooksQueue
      VisibilityTimeout: 90
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt cryptopayWithdrawalWebhooksDLQ.Arn
        maxReceiveCount: 3
  cryptopayWithdrawalWebhooksDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-cryptopayWithdrawalWebhooksDLQ

  createUserWalletQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-createUserWalletQueue
      VisibilityTimeout: 90
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt createUserWalletDLQ.Arn
        maxReceiveCount: 3
  createUserWalletDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-createUserWalletDLQ

  trackUserOnboardingChecklistQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-trackUserOnboardingChecklistQueue
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt trackUserOnboardingChecklistDLQ.Arn
        maxReceiveCount: 3
  trackUserOnboardingChecklistDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-trackUserOnboardingChecklistDLQ

  processIncomingMasterTradesQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-processIncomingMasterTradesQueue
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt processIncomingMasterTradesDLQ.Arn
        maxReceiveCount: 3
  processIncomingMasterTradesDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-processIncomingMasterTradesDLQ

  processUserTradesQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-processUserTradesQueue
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt processUserTradesDLQ.Arn
        maxReceiveCount: 3
  processUserTradesDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-processUserTradesDLQ

  processBinanceOrdersQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-processBinanceOrdersQueue
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt processBinanceOrdersDLQ.Arn
        maxReceiveCount: 3
  processBinanceOrdersDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-processBinanceOrdersDLQ

  processBybitOrdersQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-processBybitOrdersQueue
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt processBybitOrdersDLQ.Arn
        maxReceiveCount: 3
  processBybitOrdersDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-processBybitOrdersDLQ

  handleProcessedTradesQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-handleProcessedTradesQueue
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt handleProcessedTradesDLQ.Arn
        maxReceiveCount: 3
  handleProcessedTradesDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-handleProcessedTradesDLQ

  handleFailedTradesQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-handleFailedTradesQueue
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt handleFailedTradesDLQ.Arn
        maxReceiveCount: 3
  handleFailedTradesDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-handleFailedTradesDLQ

# create lambda functions
  sendEmailOtp:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          ENV: !Ref Environment
      FunctionName: !Sub ${Environment}-sendEmailOtp
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      Handler: dist/handlers/send-email-otp.handler
      Events:
        SQSQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt emailOtpQueue.Arn
      MemorySize: 128
      Timeout: 30
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt emailOtpDLQ.Arn
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:common-secrets/${Environment}*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:notifications-service/${Environment}*

  sendEmailNotifications:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          ENV: !Ref Environment
      FunctionName: !Sub ${Environment}-sendEmailNotifications
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      Handler: dist/handlers/send-email-notifications.handler
      Events:
        SQSQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt emailNotificationsQueue.Arn
      MemorySize: 128
      Timeout: 60
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt emailNotificationsDLQ.Arn
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:notifications-service/${Environment}*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:users-service-secrets/${Environment}*


  userReferralsTracking:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          ENV: !Ref Environment
      FunctionName: !Sub ${Environment}-userReferralsTracking 
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      Handler: dist/handlers/track-user-referrals.handler
      Events:
        SQSQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt userReferralsTrackingQueue.Arn
      MemorySize: 128
      Timeout: 90
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt userReferralsTrackingDLQ.Arn
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:trading-engine-service-secrets/${Environment}*
              - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:users-service-secrets/${Environment}*
              - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:common-secrets/${Environment}*
          - Effect: Allow
            Action:
              - sqs:SendMessage
              - sqs:SendMessageBatch
            Resource:
              - !GetAtt trackUserOnboardingChecklistQueue.Arn
            
  processCryptopayChannelsWebhooks:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          ENV: !Ref Environment
      FunctionName: !Sub ${Environment}-processCryptopayChannelsWebhooks
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      Handler: dist/handlers/process-cryptopay-channels-webhooks.handler
      Events:
        SQSQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt cryptopayChannelsWebhooksQueue.Arn
      MemorySize: 128
      Timeout: 90
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt cryptopayChannelsWebhooksDLQ.Arn
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:wallets-service-secrets/${Environment}*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:common-secrets/${Environment}*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:users-service-secrets/${Environment}*
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:SendMessageBatch
              Resource:
                - !GetAtt trackUserOnboardingChecklistQueue.Arn
                - !GetAtt emailNotificationsQueue.Arn


  processCryptopayInvoiceWebhooks:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          ENV: !Ref Environment
      FunctionName: !Sub ${Environment}-processCryptopayInvoiceWebhooks
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      Handler: dist/handlers/process-cryptopay-invoice-webhooks.handler
      Events:
        SQSQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt cryptopayInvoiceWebhooksQueue.Arn
      MemorySize: 128
      Timeout: 90
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt cryptopayInvoiceWebhooksDLQ.Arn
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:wallets-service-secrets/${Environment}*

  processCryptopayWithdrawalWebhooks:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          ENV: !Ref Environment
      FunctionName: !Sub ${Environment}-processCryptopayWithdrawalWebhooks
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      Handler: dist/handlers/process-cryptopay-withdrawal-webhooks.handler
      Events:
        SQSQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt cryptopayWithdrawalWebhooksQueue.Arn
      MemorySize: 128
      Timeout: 90
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt cryptopayWithdrawalWebhooksDLQ.Arn
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:wallets-service-secrets/${Environment}*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:common-secrets/${Environment}*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:users-service-secrets/${Environment}*
                
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:SendMessageBatch
              Resource:
                - !GetAtt emailNotificationsQueue.Arn
      
  createUserWallet:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          ENV: !Ref Environment
      FunctionName: !Sub ${Environment}-createUserWallet
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      Handler: dist/handlers/create-user-wallet.handler
      Events:
        SQSQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt createUserWalletQueue.Arn
      MemorySize: 128
      Timeout: 90
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt createUserWalletDLQ.Arn
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:common-secrets/${Environment}*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:wallets-service-secrets/${Environment}*

  trackUserOnboardingChecklist:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          ENV: !Ref Environment
      FunctionName: !Sub ${Environment}-trackUserOnboardingChecklist
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      Handler: dist/handlers/track-user-onboarding-checklist.handler
      Events:
        SQSQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt trackUserOnboardingChecklistQueue.Arn
      MemorySize: 128
      Timeout: 60
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt trackUserOnboardingChecklistDLQ.Arn
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:users-service-secrets/${Environment}*

  processIncomingMasterTrades:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          ENV: !Ref Environment
      FunctionName: !Sub ${Environment}-processIncomingMasterTrades
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      Handler: dist/handlers/process-incoming-master-trades.handler
      Events:
        SQSQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt processIncomingMasterTradesQueue.Arn
      MemorySize: 128
      Timeout: 60
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt processIncomingMasterTradesDLQ.Arn
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:trading-engine-service-secrets/${Environment}*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:common-secrets/${Environment}*
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:SendMessageBatch
              Resource:
                - !GetAtt processUserTradesQueue.Arn

  processUserTrades:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          ENV: !Ref Environment
      FunctionName: !Sub ${Environment}-processUserTrades
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      Handler: dist/handlers/process-user-trades.handler
      Events:
        SQSQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt processUserTradesQueue.Arn
      MemorySize: 128
      Timeout: 60
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt processUserTradesDLQ.Arn
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:trading-engine-service-secrets/${Environment}*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:common-secrets/${Environment}*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:wallets-service-secrets/${Environment}*
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:SendMessageBatch
              Resource:
                - !GetAtt processBinanceOrdersQueue.Arn
                - !GetAtt processBybitOrdersQueue.Arn
                - !GetAtt handleFailedTradesQueue.Arn

  processBinanceOrders:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          ENV: !Ref Environment
      FunctionName: !Sub ${Environment}-processBinanceOrders
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      Handler: dist/handlers/binance-exchange/process-binance-orders.handler
      Events:
        SQSQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt processBinanceOrdersQueue.Arn
      MemorySize: 128
      Timeout: 60
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt processBinanceOrdersDLQ.Arn
      # Add VPC Configuration
      VpcConfig:
        !If
          - HasVpcConfig
          - SubnetIds: !Ref SubnetIds
            SecurityGroupIds: !Ref SecurityGroupIds
          - !Ref AWS::NoValue
      Policies:
        - AWSLambdaBasicExecutionRole
        # Add VPC execution role if using VPC
        - !If
          - HasVpcConfig
          - AWSLambdaVPCAccessExecutionRole
          - !Ref AWS::NoValue
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:trading-engine-service-secrets/${Environment}*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:common-secrets/${Environment}*
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:SendMessageBatch
              Resource:
                - !GetAtt handleProcessedTradesQueue.Arn
                - !GetAtt handleFailedTradesQueue.Arn

  processBybitOrders:
