      MemorySize: 128
      Timeout: 60
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt processBybitOrdersDLQ.Arn
      # Add VPC Configuration
      VpcConfig:
        !If
          - HasVpcConfig
          - SubnetIds: !Ref SubnetIds
            SecurityGroupIds: !Ref SecurityGroupIds
          - !Ref AWS::NoValue
      Policies:
        - AWSLambdaBasicExecutionRole
        # Add VPC execution role if using VPC
        - !If
          - HasVpcConfig
          - AWSLambdaVPCAccessExecutionRole
          - !Ref AWS::NoValue
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:trading-engine-service-secrets/${Environment}*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:common-secrets/${Environment}*
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:SendMessageBatch
              Resource:
                - !GetAtt handleProcessedTradesQueue.Arn
                - !GetAtt handleFailedTradesQueue.Arn

  handleProcessedTrades:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          ENV: !Ref Environment
      FunctionName: !Sub ${Environment}-handleProcessedTrades
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      Handler: dist/handlers/handle-processed-trades.handler
      Events:
        SQSQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt handleProcessedTradesQueue.Arn
      MemorySize: 128
      Timeout: 60
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt handleProcessedTradesDLQ.Arn
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:trading-engine-service-secrets/${Environment}*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:common-secrets/${Environment}*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:users-service-secrets/${Environment}*
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:SendMessageBatch
              Resource:
                - !GetAtt emailNotificationsQueue.Arn

  handleFailedTrades:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          ENV: !Ref Environment
      FunctionName: !Sub ${Environment}-handleFailedTrades
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      Handler: dist/handlers/handle-failed-trades.handler
      Events:
        SQSQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt handleFailedTradesQueue.Arn
      MemorySize: 128
      Timeout: 60
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt handleFailedTradesDLQ.Arn
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:trading-engine-service-secrets/${Environment}*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:common-secrets/${Environment}*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:wallets-service-secrets/${Environment}*
            # - Effect: Allow
            #   Action:
            #     - sqs:SendMessage
            #     - sqs:SendMessageBatch
            #   Resource:
            #     - !GetAtt handleProcessedTradesQueue.Arn
            #     - !GetAtt handleFailedTradesQueue.Arn